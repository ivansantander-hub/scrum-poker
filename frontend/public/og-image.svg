<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0d0d0d"/>
  
  <!-- Background gradient -->
  <defs>
    <radialGradient id="glow1" cx="20%" cy="20%">
      <stop offset="0%" stop-color="#ff3c3c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff3c3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="80%">
      <stop offset="0%" stop-color="#ff3c3c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff3c3c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  
  <!-- Card deck illustration -->
  <g transform="translate(100, 150)">
    <!-- Back cards -->
    <rect x="40" y="20" width="120" height="170" rx="12" fill="#1a1a1a" stroke="#333" stroke-width="2" transform="rotate(-15)"/>
    <rect x="30" y="15" width="120" height="170" rx="12" fill="#1a1a1a" stroke="#333" stroke-width="2" transform="rotate(-8)"/>
    <!-- Front card -->
    <rect x="20" y="10" width="120" height="170" rx="12" fill="#ff3c3c"/>
    <text x="80" y="115" font-family="Arial Black, sans-serif" font-size="72" fill="white" text-anchor="middle">8</text>
  </g>
  
  <!-- Spade symbol -->
  <g transform="translate(750, 180)">
    <path d="M0 -50 C-50 -100, -100 -50, 0 50 C100 -50, 50 -100, 0 -50" fill="#ff3c3c" transform="scale(1.2)"/>
    <ellipse cx="0" cy="20" rx="35" ry="25" fill="#0d0d0d"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="400" font-family="Arial Black, sans-serif" font-size="64" fill="#f5f5f5" text-anchor="middle">SCRUM POKER</text>
  <text x="600" y="460" font-family="Arial, sans-serif" font-size="28" fill="#666" text-anchor="middle">Free Planning Poker for Agile Teams</text>
  
  <!-- Features -->
  <g transform="translate(200, 520)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" fill="#ff3c3c">♠ Real-time</text>
    <text x="200" y="0" font-family="Arial, sans-serif" font-size="20" fill="#ff3c3c">♦ Fibonacci & Hours</text>
    <text x="480" y="0" font-family="Arial, sans-serif" font-size="20" fill="#ff3c3c">♥ No Sign-up</text>
  </g>
</svg>
